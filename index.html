<!DOCTYPE html>
<html>
    <head><title>My fragrance app</title><link rel="stylesheet" href="style.css"></head>
    <body>

    <h1>Hello, fragrance app</h1>
    <div id="weather"></div>
    <label for="occasion">Occasion:</label>
<select id="occasion">
        <option>Date night</option>
        <option>Work or Office</option>
        <option>Club or Night out</option>
        <option>Everyday</option>
        <option>Formal event</option>
</select>
    <label for="mood">Mood:</label>
<select id="mood">
        <option>Stand out</option>
        <option>Close and intimate</option>
        <option>Warm and cozy</option>
        <option>Fresh and clean</option>
</select><label for="ask">Ask the AI anything:</label>
<input id="ask" type="text" placeholder="e.g. smell unique tonight but not too loud">

    <button id="get-pick">Get my pick</button>
    <div id="pick"></div>
<div id="wardrobe"></div>
<script src="app.js"></script>
    </body>

</html>
