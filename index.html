<!DOCTYPE html>
<html>
    <head><title>My Fragrance Coach</title><link rel="stylesheet" href="style.css"></head>
    <body>

    <h1>Fragrance Coach</h1>
    <p class="intro">Pick an occasion and mood, get a fragrance that fits tonight's weather.</p>
    <button id="dark-toggle">Dark mode</button>
    <div id="weather"></div>
    <label for="occasion">Occasion:</label>
<select id="occasion">
        <option>Date night</option>
        <option>Work or Office</option>
        <option>Club or Night out</option>
        <option>Everyday</option>
        <option>Formal event</option>
</select>
    <label for="mood">Mood:</label>
<select id="mood">
        <option>Stand out</option>
        <option>Close and intimate</option>
        <option>Warm and cozy</option>
        <option>Fresh and clean</option>
</select><label for="ask">Your question:</label>
<input id="ask" type="text" placeholder="e.g. smell unique tonight but not too loud">
<button id="ask-button">Ask Muse Spark</button>
<div id="ask-answer"></div>
    <button id="get-pick">Get my pick</button>
    <div id="pick"></div>
    <div id="ai-pick"></div>
    <p>Powered by Meta Muse Spark • muse-spark-1.3</p>
    <button id="save-favorite">Save pick as favorite</button>
<div id="favorites"></div>
<button id="generate-image">Generate mood image</button>
<div id="mood-image"></div>
<div id="wardrobe"></div>
<script src="config.js"></script>
<script src="app.js"></script>
    </body>

</html>
